<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Terminal window body -->
  <rect x="2" y="4" width="28" height="24" rx="5" fill="#1e1e1e"/>
  <rect x="2" y="4" width="28" height="24" rx="5" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.12"/>
  <!-- Title bar -->
  <path d="M2 9 a5 5 0 0 1 5 -5 h18 a5 5 0 0 1 5 5 v1 H2 Z" fill="#323234"/>
  <!-- Traffic lights -->
  <circle cx="6.5" cy="7" r="1.4" fill="#ff5f57"/>
  <circle cx="11" cy="7" r="1.4" fill="#febc2e"/>
  <circle cx="15.5" cy="7" r="1.4" fill="#28c840"/>
  <!-- > prompt chevron -->
  <polyline points="7,15 12,19 7,23" fill="none" stroke="#28c840"
    stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- cursor block -->
  <rect x="15" y="21" width="9" height="2.6" rx="0.6" fill="#e6e6e6"/>
</svg>
